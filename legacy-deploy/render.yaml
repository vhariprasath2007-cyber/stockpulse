services:
  # Backend API Service
  - type: web
    name: stockpulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Set in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
    autoDeploy: true

